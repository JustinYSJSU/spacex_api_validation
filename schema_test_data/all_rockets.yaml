type: array
items:
  type: object
  required:
    - height
    - diameter
    - mass
    - first_stage
    - second_stage
    - engines
    - landing_legs
    - payload_weights
    - flickr_images
    - name
    - type
    - active
    - stages
    - boosters
    - cost_per_launch
    - success_rate_pct
    - first_flight
    - country
    - company
    - wikipedia
    - description
    - id
  properties:
    height:
      type: [object, "null"]
      required: [meters, feet]
      properties:
        meters:
          type: [number, "null"]
        feet:
          type: [number, "null"]

    diameter:
      type: [object, "null"]
      required: [meters, feet]
      properties:
        meters:
          type: [number, "null"]
        feet:
          type: [number, "null"]

    mass:
      type: [object, "null"]
      required: [kg, lb]
      properties:
        kg:
          type: [number, "null"]
        lb:
          type: [number, "null"]

    first_stage:
      type: [object, "null"]
      required:
        - thrust_sea_level
        - thrust_vacuum
        - reusable
        - engines
        - fuel_amount_tons
        - burn_time_sec
      properties:
        thrust_sea_level:
          type: [object, "null"]
          required: [kN, lbf]
          properties:
            kN:
              type: [number, "null"]
            lbf:
              type: [number, "null"]
        thrust_vacuum:
          type: [object, "null"]
          required: [kN, lbf]
          properties:
            kN:
              type: [number, "null"]
            lbf:
              type: [number, "null"]
        reusable:
          type: [boolean, "null"]
        engines:
          type: [integer, "null"]
        fuel_amount_tons:
          type: [number, "null"]
        burn_time_sec:
          type: [number, "null"]

    second_stage:
      type: [object, "null"]
      required:
        - thrust
        - payloads
        - reusable
        - engines
        - fuel_amount_tons
        - burn_time_sec
      properties:
        thrust:
          type: [object, "null"]
          required: [kN, lbf]
          properties:
            kN:
              type: [number, "null"]
            lbf:
              type: [number, "null"]
        payloads:
          type: [object, "null"]
          required: [composite_fairing, option_1]
          properties:
            composite_fairing:
              type: [object, "null"]
              required: [height, diameter]
              properties:
                height:
                  type: [object, "null"]
                  required: [meters, feet]
                  properties:
                    meters:
                      type: [number, "null"]
                    feet:
                      type: [number, "null"]
                diameter:
                  type: [object, "null"]
                  required: [meters, feet]
                  properties:
                    meters:
                      type: [number, "null"]
                    feet:
                      type: [number, "null"]
            option_1:
              type: [string, "null"]
        reusable:
          type: [boolean, "null"]
        engines:
          type: [integer, "null"]
        fuel_amount_tons:
          type: [number, "null"]
        burn_time_sec:
          type: [number, "null"]

    engines:
      type: [object, "null"]
      required:
        - isp
        - thrust_sea_level
        - thrust_vacuum
        - number
        - type
        - version
        - layout
        - engine_loss_max
        - propellant_1
        - propellant_2
        - thrust_to_weight
      properties:
        isp:
          type: [object, "null"]
          required: [sea_level, vacuum]
          properties:
            sea_level:
              type: [number, "null"]
            vacuum:
              type: [number, "null"]
        thrust_sea_level:
          type: [object, "null"]
          required: [kN, lbf]
          properties:
            kN:
              type: [number, "null"]
            lbf:
              type: [number, "null"]
        thrust_vacuum:
          type: [object, "null"]
          required: [kN, lbf]
          properties:
            kN:
              type: [number, "null"]
            lbf:
              type: [number, "null"]
        number:
          type: [integer, "null"]
        type:
          type: [string, "null"]
        version:
          type: [string, "null"]
        layout:
          type: [string, "null"]
        engine_loss_max:
          type: [integer, "null"]
        propellant_1:
          type: [string, "null"]
        propellant_2:
          type: [string, "null"]
        thrust_to_weight:
          type: [number, "null"]

    landing_legs:
      type: [object, "null"]
      required: [number, material]
      properties:
        number:
          type: [integer, "null"]
        material:
          type: [string, "null"]

    payload_weights:
      type: [array, "null"]
      items:
        type: [object, "null"]
        required: [id, name, kg, lb]
        properties:
          id:
            type: [string, "null"]
          name:
            type: [string, "null"]
          kg:
            type: [number, "null"]
          lb:
            type: [number, "null"]

    flickr_images:
      type: [array, "null"]
      items:
        type: [string, "null"]

    name:
      type: [string, "null"]
    type:
      type: [string, "null"]
    active:
      type: [boolean, "null"]
    stages:
      type: [integer, "null"]
    boosters:
      type: [integer, "null"]
    cost_per_launch:
      type: [number, "null"]
    success_rate_pct:
      type: [number, "null"]
    first_flight:
      type: [string, "null"]
    country:
      type: [string, "null"]
    company:
      type: [string, "null"]
    wikipedia:
      type: [string, "null"]
    description:
      type: [string, "null"]
    id:
      type: [string, "null"]
