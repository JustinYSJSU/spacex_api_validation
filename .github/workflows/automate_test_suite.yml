name: SpaceX API Project CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 16 * * *' # Daily @ 8AM PST (UTC)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Java (required for Allure)
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre

      - name: Install Allure CLI
        run: |
          ALLURE_VERSION="2.27.0"
          ALLURE_HOME="/opt/allure"
          curl -sLo allure.tgz \
            https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/${ALLURE_VERSION}/allure-commandline-${ALLURE_VERSION}.tgz
          tar -xzf allure.tgz
          sudo mv allure-${ALLURE_VERSION} ${ALLURE_HOME}
          echo "${ALLURE_HOME}/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download previous Allure report
        uses: actions/download-pages-artifact@v3
        with:
          name: github-pages
          path: previous-report
        continue-on-error: true

      - name: Restore Allure history
        run: |
          if [ -d previous-report/history ]; then
            mkdir -p allure-results/history
            cp -r previous-report/history/* allure-results/history/
          fi

      - name: Run tests with pytest
        run: |
          pytest --alluredir=allure-results

      - name: Generate Allure report
        run: |
          allure generate allure-results \
            -o allure-report \
            --clean
            
      - name: Upload Allure Report Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: allure-report

  deploy-report:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
